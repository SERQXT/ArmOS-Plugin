<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArmOS Knowledge Web</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1a1a2e; --bg-card: #242445; --bg-card-alt: #1e1e3a; --bg-section: #20203d;
      --text: #e2e8f0; --text-muted: #94a3b8; --text-dim: #64748b;
      --accent: #4a9eff; --green: #34d399; --amber: #fbbf24; --red: #f87171;
      --border: #2d2d52; --radius: 10px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 24px; }
    .container { max-width: 1200px; margin: 0 auto; }

    /* Header */
    .report-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    .report-header h1 { font-size: 24px; font-weight: 700; }
    .report-header h1 span { color: var(--accent); }
    .scope-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-left: 12px; }
    .scope-badge.platform { background: var(--accent); color: #fff; }
    .scope-badge.customer { background: #7c3aed; color: #fff; }
    .report-meta { text-align: right; color: var(--text-muted); font-size: 13px; }
    .report-meta .date { font-weight: 600; color: var(--text); }

    /* KPI Grid */
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .kpi-card { background: var(--bg-card); border-radius: var(--radius); padding: 20px; border-top: 4px solid var(--border); }
    .kpi-card.green { border-top-color: var(--green); }
    .kpi-card.amber { border-top-color: var(--amber); }
    .kpi-card.red { border-top-color: var(--red); }
    .kpi-card.health { grid-column: span 2; }
    .kpi-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 8px; }
    .kpi-value { font-size: 32px; font-weight: 700; color: var(--text); line-height: 1.1; margin-bottom: 6px; }
    .kpi-value.health-score { font-size: 40px; }
    .kpi-value .unit { font-size: 16px; font-weight: 400; color: var(--text-muted); margin-left: 2px; }
    .kpi-subtitle { font-size: 12px; color: var(--text-dim); line-height: 1.4; }
    .health-bar-container { margin-top: 12px; background: var(--bg-card-alt); border-radius: 6px; height: 10px; overflow: hidden; }
    .health-bar-fill { height: 100%; border-radius: 6px; transition: width 0.5s ease; }
    .health-bar-fill.green { background: var(--green); }
    .health-bar-fill.amber { background: var(--amber); }
    .health-bar-fill.red { background: var(--red); }
    .health-summary { margin-top: 8px; font-size: 13px; color: var(--text-muted); }
    .health-formula { margin-top: 6px; font-size: 11px; color: var(--text-dim); font-family: 'SF Mono', 'Consolas', monospace; }

    /* Sections */
    .section { background: var(--bg-section); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 16px; overflow: hidden; }
    .section-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; cursor: pointer; user-select: none; transition: background 0.15s; }
    .section-header:hover { background: rgba(74, 158, 255, 0.05); }
    .section-header h2 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .count-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 22px; padding: 0 6px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; }
    .chevron { width: 20px; height: 20px; transition: transform 0.2s; color: var(--text-muted); }
    .section.collapsed .chevron { transform: rotate(-90deg); }
    .section-body { padding: 0 20px 20px; }
    .section.collapsed .section-body { display: none; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { text-align: left; padding: 10px 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); border-bottom: 2px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
    thead th:hover { color: var(--accent); }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:nth-child(even) { background: var(--bg-card-alt); }
    tbody tr:hover { background: rgba(74, 158, 255, 0.06); }
    td { padding: 10px 12px; }
    tr.flag-red { border-left: 3px solid var(--red); }
    tr.flag-amber { border-left: 3px solid var(--amber); }

    /* Pills */
    .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
    .pill.ready, .pill.fresh, .pill.covered, .pill.running, .pill.live, .pill.complete, .pill.rich { background: rgba(52, 211, 153, 0.15); color: var(--green); }
    .pill.planned, .pill.growing, .pill.partial { background: rgba(251, 191, 36, 0.15); color: var(--amber); }
    .pill.future, .pill.muted { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }
    .pill.stale, .pill.uncovered, .pill.error, .pill.empty, .pill.critical { background: rgba(248, 113, 113, 0.15); color: var(--red); }

    /* Coverage bar */
    .coverage-bar { display: inline-flex; align-items: center; gap: 8px; width: 100%; }
    .coverage-bar-track { flex: 1; height: 6px; background: var(--bg-card-alt); border-radius: 3px; overflow: hidden; }
    .coverage-bar-fill { height: 100%; border-radius: 3px; }
    .coverage-bar-label { font-size: 12px; font-weight: 600; min-width: 36px; text-align: right; }

    /* Recommendations */
    .rec-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .rec-item:last-child { border-bottom: none; }
    .rec-priority { display: flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; border-radius: 8px; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .rec-priority.high, .rec-priority.critical { background: var(--red); }
    .rec-priority.medium { background: var(--amber); color: #1a1a2e; }
    .rec-priority.low { background: var(--text-dim); }
    .rec-body h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .rec-body p { font-size: 12px; color: var(--text-muted); }

    /* Customer context */
    .context-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .context-card { background: var(--bg-card); border-radius: 8px; padding: 16px; }
    .context-card h4 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 8px; }
    .context-card p, .context-card ul { font-size: 13px; color: var(--text); line-height: 1.5; }
    .context-card ul { list-style: none; }
    .context-card ul li { padding: 3px 0; border-bottom: 1px solid var(--border); }
    .context-card ul li:last-child { border-bottom: none; }

    /* Timeline */
    .timeline { position: relative; padding-left: 28px; }
    .timeline::before { content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
    .timeline-item { position: relative; padding-bottom: 20px; }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-dot { position: absolute; left: -24px; top: 4px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bg); }
    .timeline-dot.green { background: var(--green); }
    .timeline-dot.amber { background: var(--amber); }
    .timeline-dot.red { background: var(--red); }
    .timeline-dot.blue { background: var(--accent); }
    .timeline-dot.muted { background: var(--text-dim); }
    .timeline-date { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
    .timeline-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .timeline-detail { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* Gaps */
    .gap-card { display: flex; gap: 14px; padding: 14px 16px; background: var(--bg-card); border-radius: 8px; border-left: 3px solid var(--amber); margin-bottom: 10px; }
    .gap-card.critical { border-left-color: var(--red); }
    .gap-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .gap-card p { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
    .gap-card .gap-action { margin-top: 6px; font-size: 11px; font-weight: 600; color: var(--accent); }

    /* Unavailable / zero */
    .unavailable { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: rgba(248, 113, 113, 0.08); border: 1px solid rgba(248, 113, 113, 0.2); border-radius: 8px; color: var(--text-muted); font-size: 13px; }
    .zero-state { text-align: center; padding: 24px; color: var(--text-dim); font-size: 13px; }
    .report-footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; color: var(--text-dim); font-size: 12px; }

    @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } .kpi-card.health { grid-column: span 2; } .context-grid { grid-template-columns: 1fr; } }
    @media (max-width: 520px) { .kpi-grid { grid-template-columns: 1fr; } .kpi-card.health { grid-column: span 1; } }
  </style>
</head>
<body>
  <div class="container" id="app"></div>

  <!-- ═══ REPORT DATA — agent replaces this single token ═══ -->
  <script id="report-data" type="application/json">{{REPORT_DATA}}</script>

  <script>
    const D = JSON.parse(document.getElementById('report-data').textContent);
    const $ = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
    const app = document.getElementById('app');
    const esc = s => s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const statusOf = (val, g, a) => val > g ? 'green' : val >= a ? 'amber' : 'red';
    const pct = (n, d) => d > 0 ? Math.round((n / d) * 100) : 0;
    const isCustomer = D.scope === 'customer';

    // ── Header ──
    const hdr = $('header', 'report-header');
    hdr.innerHTML = `<h1><span>Knowledge Web</span><span class="scope-badge ${D.scope}">${esc(D.scopeLabel)}</span></h1>
      <div class="report-meta"><div class="date">${esc(D.date)}</div><div>${esc(D.timestamp)}</div></div>`;
    app.appendChild(hdr);

    // ── KPI Grid ──
    const kpi = D.kpi;
    const grid = $('section', 'kpi-grid');
    function kpiCard(label, value, subtitle, status, extra) {
      const c = $('div', `kpi-card ${status}${extra || ''}`);
      c.innerHTML = `<div class="kpi-label">${esc(label)}</div><div class="kpi-value">${esc(String(value))}</div><div class="kpi-subtitle">${esc(subtitle)}</div>`;
      return c;
    }
    grid.appendChild(kpiCard('Skills', kpi.skills.total, kpi.skills.subtitle, kpi.skills.status));

    // Col 2 — context-aware
    const col2 = isCustomer ? kpi.artifacts : kpi.knowledge;
    const col2Label = isCustomer ? 'Artifacts & Specs' : 'Knowledge Entries';
    grid.appendChild(kpiCard(col2Label, col2.total, col2.subtitle, col2.status));

    grid.appendChild(kpiCard('Templates', kpi.templates.total, kpi.templates.subtitle, kpi.templates.status));
    grid.appendChild(kpiCard('MCP Tools', kpi.mcp.total, kpi.mcp.subtitle, kpi.mcp.status));
    grid.appendChild(kpiCard('Memory Patterns', kpi.memory.total, kpi.memory.subtitle, kpi.memory.status));
    grid.appendChild(kpiCard('Workspace Files', kpi.workspace.total, kpi.workspace.subtitle, kpi.workspace.status));

    // Health (wide)
    const hc = $('div', `kpi-card health ${kpi.health.status}`);
    hc.innerHTML = `<div class="kpi-label">Overall Health</div>
      <div style="display:flex;align-items:baseline;gap:12px">
        <div class="kpi-value health-score">${kpi.health.score}<span class="unit">%</span></div>
        <div class="health-summary">${esc(kpi.health.summary)}</div>
      </div>
      <div class="health-bar-container"><div class="health-bar-fill ${kpi.health.status}" style="width:${kpi.health.score}%"></div></div>
      <div class="health-formula">${esc(kpi.health.formula)}</div>`;
    grid.appendChild(hc);
    app.appendChild(grid);

    // ── Section builder ──
    const SVG_CHEVRON = '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';

    function addSection(id, title, badge, renderBody, opts = {}) {
      if (opts.customerOnly && !isCustomer) return;
      const sec = $('div', `section ${opts.open ? '' : 'collapsed'}`);
      sec.id = id;
      const hdr = $('div', 'section-header');
      hdr.innerHTML = `<h2>${esc(title)} ${badge != null ? `<span class="count-badge">${esc(String(badge))}</span>` : ''}</h2>${SVG_CHEVRON}`;
      hdr.onclick = () => sec.classList.toggle('collapsed');
      sec.appendChild(hdr);
      const body = $('div', 'section-body');
      renderBody(body);
      sec.appendChild(body);
      app.querySelector('main').appendChild(sec);
    }

    app.appendChild($('main'));

    // ── Table builder ──
    function buildTable(cols, rows, opts = {}) {
      if (!rows || rows.length === 0) return '<div class="zero-state">No entries found</div>';
      let h = '<table><thead><tr>';
      cols.forEach(c => { h += `<th data-sort="${c.type || 'string'}">${esc(c.label)}</th>`; });
      h += '</tr></thead><tbody>';
      rows.forEach(r => {
        const cls = r._flag ? ` class="flag-${r._flag}"` : '';
        h += `<tr${cls}>`;
        cols.forEach(c => {
          let v = r[c.key];
          if (c.pill && v) v = `<span class="pill ${String(v).toLowerCase().replace(/\s+/g,'-')}">${esc(v)}</span>`;
          else if (c.coverage !== undefined) {
            const p = typeof v === 'number' ? v : 0;
            const color = p > 80 ? 'var(--green)' : p >= 50 ? 'var(--amber)' : 'var(--red)';
            v = `<div class="coverage-bar"><div class="coverage-bar-track"><div class="coverage-bar-fill" style="width:${p}%;background:${color}"></div></div><span class="coverage-bar-label">${p}%</span></div>`;
          } else { v = esc(String(v ?? '')); }
          h += `<td>${v}</td>`;
        });
        h += '</tr>';
      });
      h += '</tbody></table>';
      return h;
    }

    // ── Skills ──
    addSection('skills', 'Skills Inventory', kpi.skills.total, body => {
      const s = D.sections.skills;
      if (s.pluginSummary) {
        body.innerHTML = buildTable(
          [{label:'Plugin',key:'plugin'},{label:'Skills',key:'count',type:'number'},{label:'Ready',key:'ready',type:'number'},{label:'Planned',key:'planned',type:'number'},{label:'Future',key:'future',type:'number'},{label:'Avg Triggers',key:'avgTriggers',type:'number'}],
          s.pluginSummary
        );
      }
      if (s.flags && s.flags.length > 0) {
        s.flags.forEach(f => {
          const d = $('div', `flag-${f.severity || 'amber'}`, `<strong>${esc(f.title)}</strong> &mdash; ${esc(f.detail)}`);
          d.style.cssText = `border-left:3px solid;padding:10px 12px;margin-top:8px;border-radius:0 6px 6px 0;background:${f.severity === 'red' ? 'rgba(248,113,113,0.06)' : 'rgba(251,191,36,0.06)'}`;
          body.appendChild(d);
        });
      }
    });

    // ── Knowledge / Artifacts ──
    addSection('knowledge', isCustomer ? 'Artifacts & Specs' : 'Knowledge Store Health', col2.total, body => {
      const s = D.sections.knowledge;
      if (s.unavailable) { body.innerHTML = `<div class="unavailable"><span style="font-size:18px">&#9888;</span> ${esc(s.unavailable)}</div>`; return; }
      if (s.table) {
        body.innerHTML = buildTable(s.columns || [{label:'Name',key:'name'},{label:'Detail',key:'detail'},{label:'Status',key:'status',pill:true}], s.table);
      }
      if (s.summary) body.innerHTML += `<p style="margin-top:12px;font-size:13px;color:var(--text-muted)">${esc(s.summary)}</p>`;
    });

    // ── Memory ──
    addSection('memory', 'Compass Memory Coverage', kpi.memory.total, body => {
      const s = D.sections.memory;
      if (s.unavailable) { body.innerHTML = `<div class="unavailable"><span style="font-size:18px">&#9888;</span> ${esc(s.unavailable)}</div>`; return; }
      if (s.table) {
        body.innerHTML = buildTable(s.columns || [{label:'Category',key:'category'},{label:'Count',key:'count',type:'number'},{label:'Coverage',key:'coverage',coverage:true}], s.table);
      }
      if (s.summary) body.innerHTML += `<p style="margin-top:12px;font-size:13px;color:var(--text-muted)">${esc(s.summary)}</p>`;
    });

    // ── Templates ──
    addSection('templates', 'Template Registry', kpi.templates.total, body => {
      const s = D.sections.templates;
      body.innerHTML = buildTable(
        s.columns || [{label:'Category',key:'category'},{label:'Count',key:'count',type:'number'},{label:'Types',key:'types'},{label:'Status',key:'status',pill:true}],
        s.table
      );
    });

    // ── MCP ──
    addSection('mcp', 'MCP Tool Coverage Map', kpi.mcp.total, body => {
      const s = D.sections.mcp;
      body.innerHTML = buildTable(
        s.columns || [{label:'MCP Server',key:'name'},{label:'Tools',key:'tools',type:'number'},{label:'Skills Referencing',key:'skillRefs',type:'number'},{label:'Coverage',key:'coverage',coverage:true},{label:'Status',key:'status',pill:true}],
        s.table
      );
    });

    // ── Workspace ──
    addSection('workspace', 'Workspace Files', kpi.workspace.total, body => {
      const s = D.sections.workspace;
      if (!s.table || s.table.length === 0) { body.innerHTML = '<div class="zero-state">No workspace files found</div>'; return; }
      body.innerHTML = buildTable(
        s.columns || [{label:'Folder',key:'folder'},{label:'Files',key:'files'},{label:'Status',key:'status',pill:true}],
        s.table
      );
    });

    // ── Customer Context (customer-only) ──
    addSection('customer-context', 'Customer Context & Intake', null, body => {
      const s = D.sections.customerContext;
      if (!s || !s.cards) { body.innerHTML = '<div class="zero-state">No customer context available</div>'; return; }
      const g = $('div', 'context-grid');
      s.cards.forEach(card => {
        const c = $('div', 'context-card');
        let inner = `<h4>${esc(card.title)}</h4>`;
        if (card.items) {
          inner += '<ul>' + card.items.map(i => `<li><strong style="color:var(--text-muted)">${esc(i.label)}:</strong> ${esc(i.value)}</li>`).join('') + '</ul>';
        }
        if (card.text) inner += `<p>${esc(card.text)}</p>`;
        c.innerHTML = inner;
        g.appendChild(c);
      });
      body.appendChild(g);
      if (s.flags) {
        s.flags.forEach(f => {
          const d = $('div', '');
          d.style.cssText = `border-left:3px solid var(--${f.severity === 'red' ? 'red' : f.severity === 'green' ? 'green' : 'amber'});padding:10px 12px;margin-top:12px;border-radius:0 6px 6px 0;background:rgba(${f.severity === 'red' ? '248,113,113' : f.severity === 'green' ? '52,211,153' : '251,191,36'},0.06)`;
          d.innerHTML = `<strong>${esc(f.title)}</strong> &mdash; ${esc(f.detail)}`;
          body.appendChild(d);
        });
      }
    }, { customerOnly: true, open: true });

    // ── Documented Intelligence (customer-only) ──
    addSection('documented-intel', 'Documented Intelligence', null, body => {
      const s = D.sections.documentedIntel;
      if (!s || !s.groups) { body.innerHTML = '<div class="zero-state">No documented intelligence found</div>'; return; }
      s.groups.forEach(group => {
        const h3 = $('h3', '', esc(group.title));
        h3.style.cssText = 'font-size:15px;margin:16px 0 8px;color:var(--accent)';
        body.appendChild(h3);
        const tbl = $('div', '');
        tbl.innerHTML = buildTable(
          group.columns || [{label:'Document',key:'name'},{label:'Summary',key:'summary'},{label:'Quality',key:'quality',pill:true}],
          group.rows
        );
        body.appendChild(tbl);
      });
    }, { customerOnly: true });

    // ── Knowledge Gaps (customer-only) ──
    addSection('knowledge-gaps', 'Knowledge Gaps & Missing Intelligence', null, body => {
      const s = D.sections.knowledgeGaps;
      if (!s || s.length === 0) { body.innerHTML = '<div class="zero-state">No knowledge gaps identified</div>'; return; }
      s.forEach(gap => {
        const g = $('div', `gap-card ${gap.severity === 'critical' || gap.severity === 'red' ? 'critical' : ''}`);
        g.innerHTML = `<div><h4>${esc(gap.title)}</h4><p>${esc(gap.detail)}</p>${gap.action ? `<div class="gap-action">${esc(gap.action)}</div>` : ''}</div>`;
        body.appendChild(g);
      });
    }, { customerOnly: true, open: true });

    // ── Engagement Timeline (customer-only) ──
    addSection('engagement-timeline', 'Engagement Timeline', null, body => {
      const s = D.sections.timeline;
      if (!s || s.length === 0) { body.innerHTML = '<div class="zero-state">No timeline events found</div>'; return; }
      const tl = $('div', 'timeline');
      s.forEach(ev => {
        const item = $('div', 'timeline-item');
        item.innerHTML = `<div class="timeline-dot ${ev.color || 'muted'}"></div>
          <div class="timeline-date">${esc(ev.date)}</div>
          <div class="timeline-title">${esc(ev.title)}</div>
          ${ev.detail ? `<div class="timeline-detail">${esc(ev.detail)}</div>` : ''}`;
        tl.appendChild(item);
      });
      body.appendChild(tl);
    }, { customerOnly: true, open: true });

    // ── Recommendations ──
    addSection('recommendations', 'Recommendations', null, body => {
      const s = D.sections.recommendations;
      if (!s || s.length === 0) { body.innerHTML = '<div class="zero-state">No recommendations</div>'; return; }
      s.forEach((r, i) => {
        const item = $('div', 'rec-item');
        item.innerHTML = `<div class="rec-priority ${r.priority || 'medium'}">${i + 1}</div>
          <div class="rec-body"><h4>${esc(r.title)}</h4><p>${esc(r.detail)}</p></div>`;
        body.appendChild(item);
      });
    }, { open: true });

    // ── Scoring Methodology ──
    addSection('methodology', 'How This Score Is Calculated', null, body => {
      const h = D.kpi.health;
      body.innerHTML = `
        <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">
          The Overall Health score is a weighted average of four knowledge dimensions.
          Each dimension measures how complete and current that area of the platform's knowledge is.
          A higher score means fewer gaps and fresher content.
        </p>
        <table>
          <thead><tr>
            <th data-sort="string">Dimension</th>
            <th data-sort="string">What It Measures</th>
            <th data-sort="number">Weight</th>
            <th data-sort="string">How It's Scored</th>
          </tr></thead>
          <tbody>
            <tr>
              <td><strong>Trigger Coverage</strong></td>
              <td>How many skills have defined trigger phrases for natural language matching</td>
              <td>25%</td>
              <td>skills_with_triggers / total_skills</td>
            </tr>
            <tr>
              <td><strong>Knowledge Freshness</strong></td>
              <td>How many knowledge store entries have been updated within the last 90 days</td>
              <td>25%</td>
              <td>fresh_entries / total_entries (0% if store is empty)</td>
            </tr>
            <tr>
              <td><strong>Template Coverage</strong></td>
              <td>How many templates are actively referenced by at least one skill</td>
              <td>25%</td>
              <td>referenced_templates / total_templates</td>
            </tr>
            <tr>
              <td><strong>MCP Tool Coverage</strong></td>
              <td>How many MCP tools are documented within skill SKILL.md files</td>
              <td>25%</td>
              <td>tools_with_skill_refs / total_tools</td>
            </tr>
          </tbody>
        </table>
        <div style="margin-top:16px;padding:14px 16px;background:var(--bg-card);border-radius:8px;">
          <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:8px;">This Report's Calculation</div>
          <div style="font-family:'SF Mono','Consolas',monospace;font-size:13px;color:var(--text);line-height:1.8;">
            ${esc(h.formula)}
          </div>
          <div style="margin-top:8px;font-size:13px;">
            Result: <strong style="color:var(--${h.status})">${h.score}%</strong>
            <span style="color:var(--text-dim);margin-left:8px;">${h.score > 80 ? 'Healthy' : h.score >= 50 ? 'Needs Attention' : 'Critical'}</span>
          </div>
        </div>
        <p style="font-size:12px;color:var(--text-dim);margin-top:12px;">
          If a data source is unavailable (e.g. Knowledge Store MCP not connected), its weight is
          redistributed equally among the remaining dimensions. The formula components shown above
          reflect the actual weights used for this report.
        </p>
      `;
    });

    // ── Footer ──
    const footer = $('footer', 'report-footer', `Generated by ArmOS Knowledge Web &middot; ${esc(D.timestamp)}`);
    app.appendChild(footer);

    // ── Sortable tables ──
    document.querySelectorAll('thead th').forEach(th => {
      th.addEventListener('click', () => {
        const table = th.closest('table'), tbody = table.querySelector('tbody');
        const rows = Array.from(tbody.querySelectorAll('tr'));
        const col = th.cellIndex, type = th.dataset.sort;
        const asc = !th.classList.contains('sorted-asc');
        table.querySelectorAll('th').forEach(h => h.classList.remove('sorted-asc', 'sorted-desc'));
        th.classList.add(asc ? 'sorted-asc' : 'sorted-desc');
        rows.sort((a, b) => {
          let va = a.cells[col]?.textContent.trim() || '', vb = b.cells[col]?.textContent.trim() || '';
          if (type === 'number') { va = parseFloat(va.replace(/[^0-9.\-]/g, '')) || 0; vb = parseFloat(vb.replace(/[^0-9.\-]/g, '')) || 0; return asc ? va - vb : vb - va; }
          return asc ? va.localeCompare(vb) : vb.localeCompare(va);
        });
        rows.forEach(r => tbody.appendChild(r));
      });
    });
  </script>
</body>
</html>
