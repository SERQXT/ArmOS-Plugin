name = "domo-proposal-feedback"
main = "index.js"
compatibility_date = "2024-09-23"

# Non-secret config lives here.
# All secrets are set via `wrangler secret put` — never commit them to this file.
#
# Required secrets:
#   wrangler secret put DOMO_CLIENT_ID       (Domo OAuth client ID)
#   wrangler secret put DOMO_CLIENT_SECRET   (Domo OAuth client secret)
#   wrangler secret put SIGNING_SECRET       (any random string, kept private)
#   wrangler secret put DATASET_ID           (Domo Dataset ID for feedback rows)
#
# Optional secrets:
#   wrangler secret put BUZZ_CHANNEL_ID      (Domo Buzz channel ID for SA alerts)
